name: Build niri for aarch64 (Debian Trixie)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config curl \
            libwayland-dev libxkbcommon-dev libinput-dev libudev-dev \
            libgbm-dev libseat-dev libpixman-1-dev libsystemd-dev \
            libdisplay-info-dev libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: niri-aarch64-trixie
          path: target/release/niri
